name: box

services:
  mysql:
    image: mysql:8.4
    container_name: box-mysql
    environment:
      MYSQL_DATABASE: box
      MYSQL_ROOT_PASSWORD: box
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "3307:3306"
    volumes:
      - box-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pbox"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: box-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - box-redis-data:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.5
    container_name: box-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - box-es-data:/usr/share/elasticsearch/data

  minio:
    image: minio/minio:latest
    container_name: box-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: box
      MINIO_ROOT_PASSWORD: boxsecret1
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - box-minio-data:/data

  box-server:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: box-server/Dockerfile
    container_name: box-server
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/box?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: box
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      BOX_MINIO_ENDPOINT: http://minio:9000
      BOX_MINIO_ACCESS_KEY: box
      BOX_MINIO_SECRET_KEY: boxsecret1
      BOX_ELASTICSEARCH_HOST: elasticsearch
      BOX_ELASTICSEARCH_PORT: 9200
      BOX_SECURITY_JWT_SECRET: box-docker-jwt-secret-change-me-please-32b
      BOX_SECURITY_CRYPTO_AES_KEY: box-docker-aes-256-key-change!!
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      elasticsearch:
        condition: service_started
      minio:
        condition: service_started

volumes:
  box-mysql-data:
  box-redis-data:
  box-es-data:
  box-minio-data:
