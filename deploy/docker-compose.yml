name: box

services:
  mysql:
    image: mysql:8.4
    container_name: box-mysql
    environment:
      MYSQL_DATABASE: box
      MYSQL_ROOT_PASSWORD: box
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "3307:3306"
    volumes:
      - box-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pbox"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: box-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - box-redis-data:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.5
    container_name: box-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - box-es-data:/usr/share/elasticsearch/data

  minio:
    image: minio/minio:latest
    container_name: box-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: box
      MINIO_ROOT_PASSWORD: boxsecret1
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - box-minio-data:/data

volumes:
  box-mysql-data:
  box-redis-data:
  box-es-data:
  box-minio-data:
