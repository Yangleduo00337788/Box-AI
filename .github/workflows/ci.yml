name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: box-server (mvn test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: box-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run unit tests
        run: mvn -B test

  box-web:
    name: box-web (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: box-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: box-web/package-lock.json
      - name: Install and typecheck box-ui
        run: npm ci && npm run typecheck
        working-directory: box-ui
      - run: npm ci
      - run: npm run test
      - run: npm run build

  box-admin-web:
    name: box-admin-web (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: box-admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: box-admin-web/package-lock.json
      - name: Install and typecheck box-ui
        run: npm ci && npm run typecheck
        working-directory: box-ui
      - run: npm ci
      - run: npm run test
      - run: npm run build

  box-ui:
    name: box-ui (test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: box-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: box-ui/package-lock.json
      - run: npm ci
      - run: npm run test

  box-sdk-js:
    name: box-sdk/js (test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: box-sdk/js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test

  backend-integration:
    name: box-server (integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: box-server
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: box
          MYSQL_ROOT_PASSWORD: box
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pbox"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
    env:
      BOX_IT_EXTERNAL: "true"
      BOX_IT_JDBC_URL: jdbc:mysql://127.0.0.1:3306/box?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      BOX_IT_JDBC_USER: root
      BOX_IT_JDBC_PASSWORD: box
      BOX_IT_REDIS_HOST: 127.0.0.1
      BOX_IT_REDIS_PORT: "6379"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run integration tests
        run: mvn -B -pl box-bootstrap -am -Pintegration test
