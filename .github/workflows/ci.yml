name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: box-server (mvn test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: box-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run unit tests
        run: mvn -B test

  box-web:
    name: box-web (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: box-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: box-web/package-lock.json
      - name: Install and typecheck box-ui
        run: npm ci && npm run typecheck
        working-directory: box-ui
      - run: npm ci
      - run: npm run test
      - run: npm run build

  box-admin-web:
    name: box-admin-web (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: box-admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: box-admin-web/package-lock.json
      - name: Install and typecheck box-ui
        run: npm ci && npm run typecheck
        working-directory: box-ui
      - run: npm ci
      - run: npm run build
