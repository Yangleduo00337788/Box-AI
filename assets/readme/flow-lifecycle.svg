<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="lcTitle">
  <title id="lcTitle">Box Agent 配置与发布生命周期</title>
  <rect width="1200" height="280" rx="20" fill="#fafafa"/>
  <text x="60" y="48" fill="#222222" font-family="system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="24" font-weight="700">Agent 配置与发布生命周期</text>
  <text x="60" y="76" fill="#777777" font-family="system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16">生产环境仅运行 Published Version，草稿与已发布配置严格隔离</text>
  <g transform="translate(60 110)">
    <rect x="0" y="0" width="140" height="64" rx="12" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
    <text x="70" y="28" fill="#222222" text-anchor="middle" font-family="system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" font-weight="600">草稿编辑</text>
    <text x="70" y="46" fill="#8b8b8b" text-anchor="middle" font-family="Consolas, monospace" font-size="11">Builder</text>
    <path d="M148 32h36" stroke="#c5c5c5" stroke-width="2"/><polygon points="184,32 176,28 176,36" fill="#c5c5c5"/>
    <rect x="192" y="0" width="140" height="64" rx="12" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
    <text x="262" y="28" fill="#222222" text-anchor="middle" font-family="system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" font-weight="600">配置校验</text>
    <text x="262" y="46" fill="#8b8b8b" text-anchor="middle" font-family="system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11">模型 / 工具 / 知识库</text>
    <path d="M340 32h36" stroke="#c5c5c5" stroke-width="2"/><polygon points="376,32 368,28 368,36" fill="#c5c5c5"/>
    <rect x="384" y="0" width="140" height="64" rx="12" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
    <text x="454" y="28" fill="#222222" text-anchor="middle" font-family="system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" font-weight="600">生成版本</text>
    <text x="454" y="46" fill="#8b8b8b" text-anchor="middle" font-family="Consolas, monospace" font-size="11">AgentVersion</text>
    <path d="M532 32h36" stroke="#c5c5c5" stroke-width="2"/><polygon points="568,32 560,28 560,36" fill="#c5c5c5"/>
    <rect x="576" y="0" width="140" height="64" rx="12" fill="#222222"/>
    <text x="646" y="28" fill="#ffffff" text-anchor="middle" font-family="system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" font-weight="600">发布上线</text>
    <text x="646" y="46" fill="#cbcbcb" text-anchor="middle" font-family="Consolas, monospace" font-size="11">Published</text>
    <path d="M724 32h36" stroke="#c5c5c5" stroke-width="2"/><polygon points="760,32 752,28 752,36" fill="#c5c5c5"/>
    <rect x="768" y="0" width="120" height="64" rx="12" fill="#ffffff" stroke="#48c79c" stroke-width="2"/>
    <text x="828" y="28" fill="#222222" text-anchor="middle" font-family="system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" font-weight="600">Web Chat</text>
    <text x="828" y="46" fill="#8b8b8b" text-anchor="middle" font-family="system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11">对话工作台</text>
    <rect x="904" y="0" width="120" height="64" rx="12" fill="#ffffff" stroke="#48c79c" stroke-width="2"/>
    <text x="964" y="28" fill="#222222" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="600">Open API</text>
    <text x="964" y="46" fill="#8b8b8b" text-anchor="middle" font-family="system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11">API Key</text>
    <rect x="1040" y="0" width="100" height="64" rx="12" fill="#ffffff" stroke="#48c79c" stroke-width="2"/>
    <text x="1090" y="28" fill="#222222" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="600">Embed</text>
    <text x="1090" y="46" fill="#8b8b8b" text-anchor="middle" font-family="system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11">嵌入站点</text>
    <path d="M888 32h12" stroke="#c5c5c5" stroke-width="2"/>
    <path d="M1024 32h12" stroke="#c5c5c5" stroke-width="2"/>
  </g>
  <text x="60" y="248" fill="#8b8b8b" font-family="system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14">运行时：box-agent（AgentChatExecutor）负责对话；box-runtime（WorkflowExecutor）负责工作流。</text>
</svg>
