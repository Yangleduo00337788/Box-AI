      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f3f3f3"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ececec" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" rx="20" fill="#fafafa"/>
  <rect width="1200" height="400" rx="20" fill="url(#grid)" opacity="0.45"/>
  <rect x="28" y="28" width="1144" height="344" rx="16" fill="none" stroke="#e7e7e7" stroke-width="1.5"/>

  <text x="72" y="88" fill="#8b8b8b" font-family="system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" letter-spacing="0.1em">ENTERPRISE AI AGENT PLATFORM</text>
  <text x="72" y="128" fill="#222222" font-family="system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="52" font-weight="700">Box</text>
