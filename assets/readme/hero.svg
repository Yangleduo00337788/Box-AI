  <text x="72" y="218" fill="#484848" font-family="system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="26" font-weight="600">企业级 AI Agent 创建、编排、运行与发布平台</text>
  <text x="72" y="252" fill="#777777" font-family="system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18">统一承载模型、知识库、工具链与工作流，支持从原型验证到生产发布的全生命周期。</text>

