    <rect x="24" y="134" width="292" height="44" rx="10" fill="#f3f3f3" stroke="#e7e7e7"/><text x="170" y="160" fill="#484848" text-anchor="middle" font-family="system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13">SSE 流式对话</text>
    <rect x="24" y="190" width="292" height="44" rx="10" fill="#f3f3f3" stroke="#e7e7e7"/><text x="170" y="216" fill="#484848" text-anchor="middle" font-family="system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13">API Key + box-sdk (JS / Python)</text>
    <rect x="24" y="246" width="292" height="52" rx="10" fill="#48c79c" fill-opacity="0.12" stroke="#48c79c" stroke-width="2"/><text x="170" y="276" fill="#222222" text-anchor="middle" font-family="system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14">Embed Web Chat + 自定义域名</text>
