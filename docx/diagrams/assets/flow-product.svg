    <rect x="176" y="78" width="140" height="44" rx="10" fill="#f3f3f3" stroke="#e7e7e7"/><text x="246" y="104" fill="#484848" text-anchor="middle" font-family="system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13">Agent Builder</text>
    <rect x="24" y="134" width="140" height="44" rx="10" fill="#f3f3f3" stroke="#e7e7e7"/><text x="94" y="160" fill="#484848" text-anchor="middle" font-family="system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13">工作流编排器</text>
    <rect x="176" y="134" width="140" height="44" rx="10" fill="#f3f3f3" stroke="#e7e7e7"/><text x="246" y="160" fill="#484848" text-anchor="middle" font-family="system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13">插件市场</text>
    <rect x="24" y="190" width="140" height="44" rx="10" fill="#f3f3f3" stroke="#e7e7e7"/><text x="94" y="216" fill="#484848" text-anchor="middle" font-family="system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13">知识库 / 工具</text>
