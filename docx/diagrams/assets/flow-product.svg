    <rect x="24" y="190" width="140" height="44" rx="10" fill="#f3f3f3" stroke="#e7e7e7"/><text x="94" y="216" fill="#484848" text-anchor="middle" font-family="system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13">运营位配置</text>
    <rect x="176" y="190" width="140" height="44" rx="10" fill="#f3f3f3" stroke="#e7e7e7"/><text x="246" y="216" fill="#484848" text-anchor="middle" font-family="system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13">全平台审计</text>
    <rect x="24" y="246" width="292" height="52" rx="10" fill="#222222"/><text x="170" y="276" fill="#ffffff" text-anchor="middle" font-family="system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14">SUPER_ADMIN / OPS / FINANCE / CONTENT</text>
