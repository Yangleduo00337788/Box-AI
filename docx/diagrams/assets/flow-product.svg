  <text x="60" y="76" fill="#777777" font-family="system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16">C 端工作台 + 平台管理 + 开放集成，覆盖 Agent 全生命周期</text>

  <g transform="translate(60 110)">
    <rect x="0" y="0" width="340" height="320" rx="16" fill="#ffffff" stroke="#dcdcdc"/>
